name: 'Close stale issues and pull requests with no recent activity'
on:
  schedule:
  - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
      with:
        stale-issue-message: 'This issue has been marked as stale due to 90 days of inactivity. To prevent automatic closure after at least 7 days, remove the stale label or add a comment. You can reopen a closed issue at any time.'
        stale-pr-message: 'This pull request has been marked as stale due to 90 days of inactivity. To prevent automatic closure after at least 7 days, remove the stale label or add a comment. You can reopen a closed pull request at any time.'
        exempt-issue-labels: bug,enhancement
        exempt-pr-labels: bug,enhancement
        days-before-stale: 90
        days-before-close: 7
        remove-stale-when-updated: true
