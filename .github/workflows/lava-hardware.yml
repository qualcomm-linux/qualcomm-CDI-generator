name: LAVA hardware

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: >
          Successful qcom-deb-images Build workflow run ID. Leave empty to
          select the latest qualifying daily build.
        type: string
        default: ''
      suite:
        description: Debian suite in the qcom-deb-images build
        type: string
        default: trixie

permissions:
  actions: read
  contents: read

jobs:
  schema-check:
    if: github.repository == 'qualcomm-linux/qualcomm-CDI-generator'
    uses: ./.github/workflows/lava-schema-check.yml

  resolve-image:
    if: github.repository == 'qualcomm-linux/qualcomm-CDI-generator'
    needs: schema-check
    uses: ./.github/workflows/resolve-qcom-image.yml
    with:
      run_id: ${{ inputs.run_id || '' }}
      suite: ${{ inputs.suite || 'trixie' }}

  hardware-tests:
    if: github.repository == 'qualcomm-linux/qualcomm-CDI-generator'
    needs: [schema-check, resolve-image]
    uses: ./.github/workflows/lava-test.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_download_url: ${{ needs.resolve-image.outputs.build_url }}
      suite: ${{ inputs.suite || 'trixie' }}
