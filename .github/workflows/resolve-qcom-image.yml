name: Resolve qcom-deb image

on:
  workflow_call:
    inputs:
      run_id:
        description: Completed qcom-deb-images Build run ID with a valid publication no older than three months; empty selects the latest
        required: false
        type: string
      suite:
        description: Debian suite required by the LAVA templates
        required: true
        type: string
    outputs:
      build_url:
        description: Immutable qcom-deb-images artifact prefix
        value: ${{ jobs.resolve.outputs.build_url }}
      run_id:
        description: Selected qcom-deb-images workflow run ID
        value: ${{ jobs.resolve.outputs.run_id }}

permissions: {}

jobs:
  resolve:
    name: Resolve qcom-deb daily image
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build_url: ${{ steps.resolve.outputs.build_url }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest published image
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail

          python3 ci/qcom_image_resolver.py resolve-image \
            --run-id "$REQUESTED_RUN_ID" \
            --suite "$SUITE" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
